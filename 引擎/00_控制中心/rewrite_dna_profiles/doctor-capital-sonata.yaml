dna_profile:
  dna_id: doctor-capital-sonata
  display_name: 博士·资本奏鸣曲 DNA
  source_corpus:
    root: ${DASHENG_CAPITAL_SONATA_CORPUS:-~/Documents/newma-corpora/capital-sonata}
    families:
      - wechat_dna/articles 中的资本奏鸣曲历史稿
      - 2025-2026 年市场时评与人工修订稿
    learned_at: 2026-08-09
  exclusivity: transwrite 激活本档案时，不并行混入其他作者 DNA
  opening_mode:
    required_sequence:
      - 一句可核验出处的名人名言
      - 具体故事、人物场景或短段子
      - 由场景自然翻转到本文核心判断
    intro_heading: 引言
    forbidden:
      - 用摘要替代引言
      - 直接罗列六个新闻或三项数据
      - 文章提到、本文将、让我们、值得注意的是
      - 不是……而是……、先把……说清楚、真正的问题是
  voice:
    baseline: 专业底色、江湖口吻、冷幽默、敢下判断
    sentence_profile:
      short_ratio: 0.34
      medium_ratio: 0.49
      long_ratio: 0.17
    paragraph_profile:
      preferred_sentences: 1-3
      maximum_consecutive_abstract_paragraphs: 2
    rhetorical_question: medium
    rhetorical_question_minimum: 3
    irony_level: medium
    explicit_judgment: high
    signature_devices:
      - 江湖黑话或民间比喻，但每节最多两处
      - 机构拟人化，让公司、央行、华尔街成为行动者
      - 至少一处历史类比，并明确类比边界
      - 允许一句冷幽默，不允许段段抖机灵
  density:
    evidence_before_commentary: true
    delete_if_no_new_fact_mechanism_or_judgment: true
    maximum_metaphors_per_section: 2
    repeat_conclusion_limit: 1
    historical_analogy_required: true
    minimum_chinese_characters: 5000
    minimum_source_links: 8
    minimum_question_marks: 3
    minimum_effective_visuals: 6
    minimum_primary_or_institutional_visuals: 4
    evidence_loop: 每个核心章节至少包含一组可核验数据、一个传导机制和一个明确判断
  evidence_language:
    source_priority:
      - 公司、监管机构、央行、FRED、IMF、WGC 等官方原始资料
      - 高盛、摩根士丹利、花旗、野村、瑞银等机构研报
      - Bloomberg、CNBC、BBC、CBC、华尔街见闻等新闻原网页
      - Reddit、X、小红书、微博等广泛流传且直接切题的材料
    pricing_rules:
      - 官方 API 价、聚合渠道价、订阅价和 Agent 任务价必须分开
      - 同一张表只比较同一计费口径
      - 无法从原始来源确认的数据不得写成事实
    citation_rules:
      - 数据首次出现时在句内或段尾给出来源链接
      - 引用原话使用斜体并注明人物、机构、日期
      - 文末保留完整资料来源，不以“据媒体”代替链接
  emphasis_language:
    max_highlights_per_500_chinese_chars: 3
    red:
      hex: "#D70015"
      purpose: 风险、反转、强判断
      html_class: mark-red
    blue:
      hex: "#0071E3"
      purpose: 数据、事实、核心结论
      html_class: mark-blue
    underline:
      hex: "#FFD60A"
      purpose: 全文最重要的一句话
      html_class: mark-underline
    generic_bold: 只用于术语或小结，不允许整段加粗
  visual_language:
    real_image_priority: true
    preferred_image_aspect_ratio: "16:9"
    minimum_preferred_ratio: 1.35
    portrait_or_square_policy: 有同等信息量的横版素材时不使用；必须使用时置于横版合成画面中
    source_priority:
      - 新闻原网页头图或正文图
      - 机构研报原图
      - 官方统计图或由官方数据重绘的图表
      - 社交平台广泛传播的直接证据图
      - 必要时生成的机制解释图
    rejection_rules:
      - Cookie 遮罩、导航栏、登录框或网页空白区域
      - 新闻标题截图冒充新闻图片
      - 与论证无关的官网首页或产品主页
      - 只起装饰作用、无法支撑任何一句正文的图片
      - 自制评分、概率或路径图冒充观测数据
    caption:
      font_px: 10
      color: "#8A8F98"
      background: none
      border: none
      must_include: 图意、来源、数据口径或必要限制
    chart:
      role: 证据，不抢正文标题层级
      title_once: true
      title_location: HTML 图注卡顶部
      title_font_px: 16
      title_inside_png: false
      source_location: 图表下方图注
      style: 白底、轻网格、统一蓝红金调色、数据标签克制、避免仪表盘感
  closing_mode:
    sequence:
      - 回扣开头故事或名言
      - 一句明确判断
      - 风险边界
    cta_style: 默认不强行求转发或关注
  quality_gate:
    forbidden_phrases:
      - 不是……而是……
      - 先把……说清楚
      - 让我们
      - 文章提到
      - 本文将
      - 值得注意的是
      - 底层逻辑
    required_emphasis:
      red_bold: 核心结论、风险与反转
      blue: 关键数据、事实与需要留意的变量
      underline: 全文只保留一到两句最重要判断
      italic: 人物、机构和研报原话
    reject_if:
      - 中文字符少于 5000
      - 有效视觉少于 6 张
      - 核心价格或市场数据缺少可核验来源
      - 图注使用大字号、背景卡或与正文同字号
